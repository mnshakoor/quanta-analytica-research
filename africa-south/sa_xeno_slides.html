<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>QAP Slide Deck | SA Xenophobic Mobilization Risk | 08 May 2026</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230a0c10'/><polygon points='16,4 28,12 28,20 16,28 4,20 4,12' fill='none' stroke='%23c8a96e' stroke-width='2'/><circle cx='16' cy='16' r='4' fill='%23c8a96e'/></svg>" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --obsidian:#0a0c10;--obsidian-mid:#10131a;--obsidian-card:#13161f;
  --obsidian-border:#1c2030;--obsidian-surface:#181b26;--obsidian-lift:#1e2235;
  --gold:#c8a96e;--gold-light:#dfc28e;--gold-pale:#e8d5aa;--gold-dim:#9a7f52;
  --gold-muted:#6b5838;--gold-glow:rgba(200,169,110,.12);
  --red:#c0392b;--red-light:#e74c3c;--red-bg:rgba(192,57,43,.12);
  --amber:#d4820a;--amber-light:#f39c12;--amber-bg:rgba(212,130,10,.12);
  --green:#27ae60;--green-light:#2ecc71;--green-bg:rgba(39,174,96,.12);
  --blue:#2980b9;--blue-light:#3498db;--blue-bg:rgba(41,128,185,.12);
  --yellow:#f1c40f;--yellow-bg:rgba(241,196,15,.12);
  --slate:#5d7a9a;--slate-light:#7f9ab8;
  --text-primary:#e8e4dc;--text-secondary:#b8b0a0;--text-muted:#7a7264;--text-faint:#4a4640;
  --font-display:'Libre Baskerville',Georgia,serif;
  --font-body:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif;
  --font-mono:'IBM Plex Mono','Courier New',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--obsidian);font-family:var(--font-body);color:var(--text-primary);}
a{color:var(--gold);text-decoration:none;}
a:hover{color:var(--gold-light);text-decoration:underline;}

/* ---- DECK ---- */
#deck{width:100%;height:100%;position:relative;}
.slide{position:absolute;inset:0;display:none;flex-direction:column;background:var(--obsidian);overflow:hidden;}
.slide.active{display:flex;}

/* ---- HEADER ---- */
.s-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 16px;border-bottom:1px solid var(--obsidian-border);
  background:rgba(10,12,16,.97);flex-shrink:0;gap:8px;
}
.s-brand{font-family:var(--font-mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-dim);white-space:nowrap;}
.s-brand span{color:var(--text-faint);}
.s-doc{font-family:var(--font-mono);font-size:.58rem;color:var(--text-faint);letter-spacing:.1em;flex:1;text-align:center;}
.s-header-right{display:flex;align-items:center;gap:8px;}
.s-classify{font-family:var(--font-mono);font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--amber);border:1px solid var(--amber);padding:2px 7px;border-radius:3px;background:var(--amber-bg);white-space:nowrap;}

/* ---- NAV MENU BUTTON ---- */
.nav-toggle{
  display:flex;align-items:center;gap:5px;
  font-family:var(--font-mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;
  background:var(--obsidian-card);border:1px solid var(--obsidian-border);color:var(--gold);
  padding:4px 10px;border-radius:3px;cursor:pointer;transition:.15s;white-space:nowrap;
}
.nav-toggle:hover{background:var(--obsidian-lift);border-color:var(--gold-dim);}
.nav-toggle svg{width:12px;height:12px;fill:var(--gold);transition:transform .2s;}
.nav-toggle.open svg{transform:rotate(180deg);}

/* ---- NAV DROPDOWN ---- */
#nav-menu{
  position:fixed;top:43px;right:16px;z-index:9999;
  background:var(--obsidian-card);border:1px solid var(--obsidian-border);
  border-radius:6px;min-width:260px;overflow:hidden;
  box-shadow:0 8px 32px rgba(0,0,0,.6);
  display:none;
}
#nav-menu.open{display:block;}
.nav-menu-header{
  padding:8px 14px;font-family:var(--font-mono);font-size:.6rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--gold-dim);border-bottom:1px solid var(--obsidian-border);
  background:var(--obsidian-surface);
}
.nav-menu-item{
  display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;
  border-bottom:1px solid var(--obsidian-border);transition:background .12s;
}
.nav-menu-item:last-child{border-bottom:none;}
.nav-menu-item:hover{background:var(--obsidian-lift);}
.nav-menu-item.current{background:var(--gold-glow);}
.nav-item-num{
  font-family:var(--font-mono);font-size:.58rem;color:var(--gold-dim);
  background:var(--obsidian-surface);border:1px solid var(--obsidian-border);
  padding:1px 5px;border-radius:2px;white-space:nowrap;min-width:38px;text-align:center;
}
.nav-item-label{font-family:var(--font-mono);font-size:.68rem;color:var(--text-secondary);letter-spacing:.04em;}
.nav-menu-item.current .nav-item-label{color:var(--gold);}

/* ---- FOOTER ---- */
.s-footer{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 16px;border-top:1px solid var(--obsidian-border);
  background:rgba(10,12,16,.97);flex-shrink:0;gap:8px;
}
.s-num{font-family:var(--font-mono);font-size:.62rem;color:var(--text-faint);letter-spacing:.1em;white-space:nowrap;}
.s-nav{display:flex;gap:8px;}
.s-nav button{
  font-family:var(--font-mono);font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;
  background:var(--obsidian-card);border:1px solid var(--obsidian-border);color:var(--gold);
  padding:4px 14px;border-radius:3px;cursor:pointer;transition:.15s;
}
.s-nav button:hover{background:var(--obsidian-lift);border-color:var(--gold-dim);}
.s-nav button:disabled{opacity:.3;cursor:default;}
.s-progress-bar{height:2px;background:var(--obsidian-border);flex:1;border-radius:2px;overflow:hidden;}
.s-progress-fill{height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold));transition:width .3s ease;border-radius:2px;}

/* ---- BODY ---- */
.s-body{flex:1;overflow:hidden;padding:16px 32px 12px;display:flex;flex-direction:column;gap:12px;}

/* ---- TAGS ---- */
.sec-tag{display:inline-flex;align-items:center;gap:8px;}
.sec-num{font-family:var(--font-mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--gold-dim);background:var(--gold-glow);border:1px solid var(--gold-muted);padding:2px 8px;border-radius:3px;}
.slide-h2{font-family:var(--font-display);font-size:clamp(1rem,1.6vw,1.5rem);font-weight:700;color:var(--text-primary);line-height:1.2;}

/* ---- TITLE SLIDE ---- */
.title-logo{width:64px;height:auto;margin-bottom:12px;}
.title-eyebrow{font-family:var(--font-mono);font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px;}
.title-h1{font-family:var(--font-display);font-size:clamp(1.3rem,2.2vw,2rem);font-weight:700;line-height:1.18;color:var(--text-primary);margin-bottom:8px;}
.title-h1 .gold{color:var(--gold);}
.title-sub{font-size:.88rem;color:var(--text-secondary);max-width:660px;line-height:1.6;margin-bottom:16px;}
.meta-row{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-bottom:14px;}
.meta-cell{display:flex;flex-direction:column;gap:2px;}
.meta-cell .lbl{font-family:var(--font-mono);font-size:.52rem;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);}
.meta-cell .val{font-family:var(--font-mono);font-size:.75rem;font-weight:600;color:var(--text-primary);}
.meta-div{width:1px;height:28px;background:var(--gold-dim);align-self:center;}
.threat-badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:.65rem;
  letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:3px 10px;border-radius:3px;border:1px solid;}
.threat-badge.elevated{color:var(--yellow);border-color:var(--yellow);background:var(--yellow-bg);}
.threat-dot{width:6px;height:6px;border-radius:50%;background:currentColor;animation:blink 1.6s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.2;}}
.metrics-row{display:flex;gap:8px;flex-wrap:wrap;}
.metric-b{background:var(--obsidian-card);border:1px solid var(--obsidian-border);border-top:2px solid var(--gold-dim);padding:7px 14px;border-radius:5px;}
.metric-b .mv{font-family:var(--font-mono);font-size:1.1rem;font-weight:700;color:var(--gold);line-height:1;}
.metric-b .ml{font-family:var(--font-mono);font-size:.55rem;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin-top:3px;}

/* ---- BLUF ---- */
.bluf-list{display:flex;flex-direction:column;gap:7px;overflow:hidden;}
.bluf-i{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:9px 12px;
  background:var(--obsidian-card);border:1px solid var(--obsidian-border);border-left:3px solid var(--gold-dim);border-radius:5px;}
.bluf-n{font-family:var(--font-mono);font-size:1rem;font-weight:700;color:var(--gold-pale);opacity:.35;line-height:1;padding-top:2px;}
.bluf-claim{font-weight:700;color:var(--text-primary);font-size:.82rem;display:block;margin-bottom:2px;}
.bluf-body{font-size:.75rem;color:var(--text-secondary);line-height:1.5;}

/* ---- TWO-COL ---- */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1;overflow:hidden;}
.panel{background:var(--obsidian-card);border:1px solid var(--obsidian-border);border-radius:6px;padding:12px 14px;overflow:hidden;}
.panel-title{font-family:var(--font-mono);font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;}

/* ---- KJ ---- */
.kj-list{display:flex;flex-direction:column;gap:6px;overflow:hidden;}
.kj-i{padding:8px 12px;background:var(--obsidian-card);border:1px solid var(--obsidian-border);border-radius:5px;border-left:4px solid;}
.kj-i.mod{border-left-color:var(--amber);}
.kj-i.watch{border-left-color:var(--yellow);}
.kj-top{display:flex;align-items:center;gap:8px;margin-bottom:3px;}
.kj-id{font-family:var(--font-mono);font-size:.58rem;color:var(--text-muted);}
.kj-conf{font-family:var(--font-mono);font-size:.56rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:1px 5px;border-radius:3px;border:1px solid;}
.kj-i.mod .kj-conf{color:var(--amber-light);border-color:var(--amber);background:var(--amber-bg);}
.kj-i.watch .kj-conf{color:var(--yellow);border-color:var(--yellow);background:var(--yellow-bg);}
.kj-text{font-size:.76rem;color:var(--text-secondary);line-height:1.5;}

/* ---- EVIDENCE ---- */
.ev-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:1;overflow:hidden;}
.ev-box{background:var(--obsidian-card);border:1px solid var(--obsidian-border);border-radius:6px;overflow:hidden;}
.ev-hdr{padding:5px 12px;font-family:var(--font-mono);font-size:.58rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;}
.ev-hdr.know{background:var(--green-bg);color:var(--green-light);border-bottom:1px solid var(--green);}
.ev-hdr.assess{background:var(--amber-bg);color:var(--amber-light);border-bottom:1px solid var(--amber);}
.ev-hdr.gap{background:var(--red-bg);color:var(--red-light);border-bottom:1px solid var(--red);}
.ev-body{padding:8px 12px;}
.ev-body li{list-style:none;font-size:.73rem;color:var(--text-secondary);line-height:1.5;padding:3px 0 3px 14px;border-bottom:1px solid var(--obsidian-border);position:relative;}
.ev-body li::before{content:'//';position:absolute;left:0;color:var(--text-faint);font-family:var(--font-mono);font-size:.6rem;}
.ev-body li:last-child{border-bottom:none;}

/* ---- TABLES ---- */
.tbl-wrap{overflow:auto;flex:1;}
table{width:100%;border-collapse:collapse;font-size:.72rem;}
thead th{background:var(--obsidian-surface);padding:6px 9px;text-align:left;font-family:var(--font-mono);font-size:.56rem;
  letter-spacing:.1em;text-transform:uppercase;color:var(--gold-dim);border-bottom:1px solid var(--obsidian-border);}
tbody tr{border-bottom:1px solid var(--obsidian-border);}
tbody tr:last-child{border-bottom:none;}
tbody td{padding:6px 9px;color:var(--text-secondary);vertical-align:top;line-height:1.5;}
tbody td:first-child{font-family:var(--font-mono);font-size:.65rem;color:var(--text-muted);}

/* ---- SCENARIOS ---- */
.sc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;flex:1;}
.sc-card{background:var(--obsidian-card);border:1px solid var(--obsidian-border);border-top:3px solid;border-radius:6px;padding:14px;}
.sc-card.best{border-top-color:var(--green);}
.sc-card.base{border-top-color:var(--amber);}
.sc-card.worst{border-top-color:var(--red);}
.sc-lbl{font-family:var(--font-mono);font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;margin-bottom:5px;display:block;}
.sc-card.best .sc-lbl{color:var(--green-light);}
.sc-card.base .sc-lbl{color:var(--amber-light);}
.sc-card.worst .sc-lbl{color:var(--red-light);}
.sc-h{font-family:var(--font-display);font-size:.88rem;font-weight:700;color:var(--text-primary);margin-bottom:5px;}
.sc-p{font-size:.74rem;color:var(--text-secondary);line-height:1.5;}
.sc-prob{font-family:var(--font-mono);font-size:.6rem;color:var(--text-muted);margin-top:7px;display:block;}

/* ---- THRESHOLDS ---- */
.thr-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;flex:1;}
.thr-cell{border-radius:6px;border:1px solid;overflow:hidden;}
.thr-cell.g{border-color:var(--green);background:var(--green-bg);}
.thr-cell.a{border-color:var(--amber);background:var(--amber-bg);}
.thr-cell.r{border-color:var(--red);background:var(--red-bg);}
.thr-hdr{padding:5px 12px;font-family:var(--font-mono);font-size:.6rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid;}
.thr-cell.g .thr-hdr{color:var(--green-light);border-color:var(--green);background:rgba(39,174,96,.18);}
.thr-cell.a .thr-hdr{color:var(--amber-light);border-color:var(--amber);background:rgba(212,130,10,.18);}
.thr-cell.r .thr-hdr{color:var(--red-light);border-color:var(--red);background:rgba(192,57,43,.18);}
.thr-body{padding:10px 12px;}
.thr-body p{font-size:.74rem;color:var(--text-secondary);line-height:1.5;margin-bottom:5px;}
.thr-body li{list-style:none;font-size:.72rem;color:var(--text-secondary);line-height:1.5;padding:2px 0 2px 12px;position:relative;}
.thr-body li::before{content:'›';position:absolute;left:0;color:var(--text-faint);}

/* ---- BEHAVIORAL ---- */
.beh-list{display:flex;flex-direction:column;gap:6px;overflow:hidden;flex:1;}
.beh-i{display:grid;grid-template-columns:40px 1fr;gap:10px;padding:9px 12px;
  background:var(--obsidian-card);border:1px solid var(--obsidian-border);border-radius:5px;}
.beh-rank{font-family:var(--font-mono);font-size:1.3rem;font-weight:700;color:var(--gold-pale);opacity:.25;line-height:1;text-align:center;}
.beh-h{font-weight:700;font-size:.8rem;color:var(--text-primary);margin-bottom:2px;}
.beh-p{font-size:.73rem;color:var(--text-secondary);line-height:1.5;}
.beh-inf{font-family:var(--font-mono);font-size:.62rem;color:var(--slate-light);font-style:italic;display:block;margin-top:2px;}

/* ---- CONFIDENCE ---- */
.conf-box{background:var(--obsidian-card);border:1px solid var(--obsidian-border);border-radius:6px;overflow:hidden;margin-bottom:10px;}
.conf-hdr{padding:7px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--obsidian-border);}
.conf-band{font-family:var(--font-mono);font-size:.62rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:2px 7px;border-radius:3px;border:1px solid;}
.conf-band.mod{color:var(--amber-light);border-color:var(--amber);background:var(--amber-bg);}
.conf-lbl{font-family:var(--font-mono);font-size:.62rem;color:var(--text-muted);}
.conf-body{padding:10px 14px;font-size:.78rem;color:var(--text-secondary);line-height:1.6;}
.flip-list{display:flex;flex-direction:column;gap:6px;}
.flip-i{background:var(--red-bg);border:1px solid var(--red);border-radius:5px;padding:7px 12px;}
.flip-lbl{font-family:var(--font-mono);font-size:.58rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--red-light);display:block;margin-bottom:2px;}
.flip-p{font-size:.74rem;color:var(--text-secondary);}

/* ---- PILLS ---- */
.band-pill{display:inline-block;font-family:var(--font-mono);font-size:.55rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:1px 5px;border-radius:3px;border:1px solid;}
.band-pill.green{color:var(--green-light);border-color:var(--green);background:var(--green-bg);}
.sp{display:inline-block;font-family:var(--font-mono);font-size:.55rem;font-weight:700;padding:1px 5px;border-radius:3px;border:1px solid;}
.sp.red{color:var(--red-light);border-color:var(--red);background:var(--red-bg);}
.sp.amber{color:var(--amber-light);border-color:var(--amber);background:var(--amber-bg);}

/* ---- MISC ---- */
.bg-grid{position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(200,169,110,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(200,169,110,.04) 1px,transparent 1px);
  background-size:40px 40px;}
.scope-note{background:rgba(93,122,154,.1);border:1px solid rgba(93,122,154,.3);border-left:3px solid var(--slate);
  border-radius:5px;padding:7px 12px;font-size:.73rem;color:var(--slate-light);font-style:italic;line-height:1.5;}

/* Source link styling */
.src-link{color:var(--gold);font-family:var(--font-mono);font-size:.65rem;display:inline-block;margin-top:3px;}
.src-link:hover{color:var(--gold-light);}
</style>
</head>
<body>
<div id="deck"></div>
<!-- NAV DROPDOWN (shared, outside slides) -->
<div id="nav-menu">
  <div class="nav-menu-header">Section Navigation</div>
</div>

<script>
const SLIDES = [
  {tag:'00 // TITLE',   label:'Title & Metadata'},
  {tag:'00 // CONTROL', label:'Production Control Gate'},
  {tag:'01 // BLUF',    label:'Bottom Line Up Front'},
  {tag:'03 // SNAPSHOT',label:'Situation Snapshot'},
  {tag:'04 // KEY JUDGMENTS', label:'Key Judgments'},
  {tag:'05 // EVIDENCE',label:'Evidence Summary'},
  {tag:'06 // ACH',     label:'Analysis of Competing Hypotheses'},

  {tag:'ANNEX B // GAPS',label:'Priority Intelligence Gaps'},
  {tag:'10 // SOURCES', label:'Source Register & WSI Audit'},
];

function renderSlide(i){
  switch(i){
    case 0: return slideTitle();
    case 1: return slideControl();
    case 2: return slideBLUF();
    case 3: return slideSnapshot();
    case 4: return slideKJs();
    case 5: return slideEvidence();
    case 6: return slideACH();
    case 7: return slideScenarios();
    case 8: return slideBehavioral();
    case 9: return slideThresholds();
    case 10: return slideConfidence();
    case 11: return slideEWI();
    case 12: return slideGaps();
    case 13: return slideSources();
  }
}

/* ===== SLIDE CONTENT ===== */
function slideTitle(){return `
<div class="bg-grid"></div>
<div class="s-body" style="justify-content:center;align-items:flex-start;padding:24px 52px;">

    <div class="meta-cell"><span class="lbl">Date</span><span class="val">08 May 2026</span></div>
    <div class="meta-div"></div>
    <div class="meta-cell"><span class="lbl">Confidence</span><span class="val">Moderate</span></div>
    <div class="meta-div"></div>
    <div class="threat-badge elevated"><span class="threat-dot"></span>ELEVATED</div>
    <div class="meta-div"></div>
    <div class="meta-cell"><span class="lbl">Classification</span><span class="val">Open Source / Partner-Facing</span></div>
  </div>
  <div class="metrics-row">

/* ===== BUILD ENGINE ===== */
let cur = 0;
const deck = document.getElementById('deck');
const navMenu = document.getElementById('nav-menu');

// Build nav items
SLIDES.forEach((s,i)=>{
  const item = document.createElement('div');
  item.className = 'nav-menu-item' + (i===0?' current':'');
  item.dataset.idx = i;
  item.innerHTML = `<span class="nav-item-num">${s.tag.split('//')[0].trim()}</span><span class="nav-item-label">${s.label}</span>`;
  item.onclick = ()=>{ go(i); closeNav(); };
  navMenu.appendChild(item);
});

// Build slides
const slideEls = SLIDES.map((_,i)=>{
  const el = document.createElement('div');
  el.className = 'slide' + (i===0?' active':'');
  el.innerHTML = renderSlide(i);
  // header
  const hdr = document.createElement('div');
  hdr.className = 's-header';
  hdr.innerHTML = `
    <div class="s-brand">QUANTA ANALYTICA <span>| MNS CONSULTING</span></div>
    <div class="s-doc">QAP-SAF-XENO-2026-0508</div>
    <div class="s-header-right">
      <div class="s-classify">Open Source</div>
      <button class="nav-toggle" id="nav-btn-${i}" onclick="toggleNav(this)">
        <svg viewBox="0 0 12 12"><path d="M1 2h10M1 6h10M1 10h10" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
        Sections
        <svg viewBox="0 0 10 6" style="width:8px;height:8px;fill:none;stroke:var(--gold);stroke-width:1.5"><path d="M1 1l4 4 4-4"/></svg>
      </button>
    </div>`;
  el.insertBefore(hdr, el.firstChild);
  // footer
  const ftr = document.createElement('div');
  ftr.className = 's-footer';
  ftr.innerHTML = `
    <div class="s-num">${i+1} / ${SLIDES.length}</div>
    <div class="s-progress-bar"><div class="s-progress-fill" style="width:${((i+1)/SLIDES.length*100).toFixed(1)}%"></div></div>
    <div class="s-nav">
      <button onclick="go(cur-1)" ${i===0?'disabled':''}>◀ Prev</button>
      <button onclick="go(cur+1)" ${i===SLIDES.length-1?'disabled':''}>Next ▶</button>
    </div>`;
  el.appendChild(ftr);
  deck.appendChild(el);
  return el;
});

function go(n){
  if(n<0||n>=SLIDES.length) return;
  slideEls[cur].classList.remove('active');
  cur=n;
  slideEls[cur].classList.add('active');
  // update nav highlight
  navMenu.querySelectorAll('.nav-menu-item').forEach((el,i)=>{
    el.classList.toggle('current', i===cur);
  });
}

let navOpen = false;
function toggleNav(btn){
  navOpen = !navOpen;
  navMenu.classList.toggle('open', navOpen);
  document.querySelectorAll('.nav-toggle').forEach(b=>b.classList.toggle('open', navOpen));
}
function closeNav(){
  navOpen = false;
  navMenu.classList.remove('open');
  document.querySelectorAll('.nav-toggle').forEach(b=>b.classList.remove('open'));
}

// Close nav on outside click
document.addEventListener('click', e=>{
  if(navOpen && !navMenu.contains(e.target) && !e.target.closest('.nav-toggle')) closeNav();
});

// Keyboard nav
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown') go(cur+1);
  if(e.key==='ArrowLeft'||e.key==='ArrowUp') go(cur-1);
  if(e.key==='Escape') closeNav();
});
</script>
